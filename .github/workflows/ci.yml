---
name: CI
'on': [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
