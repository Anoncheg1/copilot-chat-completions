---
name: CI
'on': [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Prepare tests
        run: |
          set -euo pipefail
          FILEA="server.py"
          FILEB="patch-for-test-server.py"

          # Step 1: mark matching lines with temporary comment
          sed -i 's/^from comilot.*/# REPLACED_CONTENT/' "$FILEA"
          # Step 2: keep only the first instance of the comment, delete duplicates
          awk '$0 == "# REPLACED_CONTENT" { if (!found) { found=1; print } next } { print }' "$FILEA" > "$FILEA.tmp" && mv "$FILEA.tmp" "$FILEA"
          # Step 3: replace the single remaining comment with contents of fileB
          sed -i -e '/# REPLACED_CONTENT/{r '"$FILEB"'; d}' "$FILEA"

      - name: Run tests
        run: pytest -q
