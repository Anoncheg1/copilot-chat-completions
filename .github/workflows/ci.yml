name: CI
'on': [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          TESTING: "1"
        run: pytest -q
