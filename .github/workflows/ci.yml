---
name: CI
'on': [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout copilot-sdk v1.0.8
        uses: actions/checkout@v7
        with:
          repository: 'github/copilot-sdk'
          ref: 'v1.0.8'
          path: 'copilot-sdk'
          fetch-depth: 0

      # - name: prepare copilot-sdk
      #   run: echo "PYTHONPATH=${{ github.workspace }}/copilot-sdk/python:${PYTHONPATH}" >> $GITHUB_ENV

      - name: extract copilot-sdk1 dependencies -> requirements.txt
        env:
          TARGET_FILE: ${{ github.workspace }}/copilot-sdk/python/pyproject.toml # set to your file
        shell: bash
        run: |
          grep -A 5 "dependencies\s*=" "$TARGET_FILE" | \
            grep -o '"[^"]*"' | \
            tr -d '"' > requirements.txt
          cat requirements.txt

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install deps copilot-sdk deps and deps for pytest.
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare tests
        run: |
          FILEA="server.py"
          FILEB="patch-for-test-server.py"

          # Step 1: mark matching lines with temporary comment
          sed -i 's/^from copilot.*/# REPLACED_CONTENT/' "$FILEA"
          # Step 2: keep only the first instance of the comment, delete duplicates
          awk '$0 == "# REPLACED_CONTENT" { if (!found) { found=1; print } next } { print }' "$FILEA" > "$FILEA.tmp" && mv "$FILEA.tmp" "$FILEA"
          # Step 3: replace the single remaining comment with contents of fileB
          awk -v f="$FILEB" '/# REPLACED_CONTENT/ { system("cat " f); next } { print }' "$FILEA" >tmp && mv tmp "$FILEA"

      - name: Prepare CLI shim to avoid npm install
        run: |
          set -e
          # create several plausible locations the test harness might look for
          SHIM_BIN_DIR="${{ github.workspace }}/nodejs/node_modules/.bin"
          mkdir -p "$SHIM_BIN_DIR" "${{ github.workspace }}/nodejs/bin" "${{ github.workspace }}/nodejs"

          cat > "$SHIM_BIN_DIR/copilot" <<'SH'
          #!/usr/bin/env bash
          # Minimal copilot CLI shim — extend if tests require more behavior
          case "$1" in
            --version|-v|version)
              echo "copilot-cli-shim 0.0.0"
              exit 0
              ;;
            help|-h|--help)
              echo "copilot shim help"
              exit 0
              ;;
            *)
              # Default: return minimal JSON to satisfy callers expecting structured output
              echo "{}"
              exit 0
              ;;
          esac
          SH

          # Create other likely locations and symlinks
          ln -sf "$SHIM_BIN_DIR/copilot" "${{ github.workspace }}/nodejs/bin/copilot"
          ln -sf "$SHIM_BIN_DIR/copilot" "${{ github.workspace }}/nodejs/copilot"
          chmod +x "$SHIM_BIN_DIR/copilot" "${{ github.workspace }}/nodejs/bin/copilot" "${{ github.workspace }}/nodejs/copilot"

          echo "Created CLI shim at $SHIM_BIN_DIR/copilot"

      - name: Debug - search for harness helper (optional)
        run: |
          # Print locations if the repository defines a test harness helper
          grep -R --line-number "get_cli_path_for_tests" || true
          grep -R --line-number "CLI not found for tests" || true

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/copilot-sdk/python:${PYTHONPATH}
          # Ensure our shim is on PATH so subprocess invocation finds it
          PATH: ${{ github.workspace }}/nodejs/node_modules/.bin:${PATH}
        run: python -m pytest -q
